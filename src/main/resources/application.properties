server.port=8081

spring.datasource.url=jdbc:h2:mem:cake-service
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true

cakes.populator.url=https://gist.githubusercontent.com/hart88/198f29ec5114a3ec3460/raw/8dd19a88f9b8d24c23d9960f3300d0c917a4f07c/cake.json

cakes.authentication.username=cake-user
cakes.authentication.password=cake-password

cakes.web-client.timeout-in-seconds=1
cakes.web-client.retry.max-attempts=2
cakes.web-client.retry.min-backoff-in-millis=500

cakes.external-provider.url=http://external-provider:8080/cakes
